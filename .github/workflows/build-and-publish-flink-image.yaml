name: Create and publish flink container image

on:
  push:
    branches:
    - "**"
    paths:
      - Dockerfile
      - .github/workflows/build-and-publish-flink-image.yaml
  pull_request:
    branches:
    - "main"

permissions: write-all

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: flink-steadforce

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - uses: hadolint/hadolint-action@v3.3.0
      with:
        dockerfile: Dockerfile
    - name: Log in to the container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata (tags, labels) for container
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/steadforce/applications/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
    - name: Build container image for tests
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        tags: ${{ env.IMAGE_NAME }}:test
    - name: Tag and push tested container image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
    